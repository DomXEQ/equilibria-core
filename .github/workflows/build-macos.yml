name: Build macOS Binaries

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-macos-intel:
    name: Build macOS Intel (x64)
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install boost openssl@3 libsodium miniupnpc expat protobuf cmake pkgconfig zeromq

      - name: Build
        run: |
          mkdir -p build/release
          cd build/release
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl@3 \
                -DBOOST_ROOT=/usr/local \
                -DBOOST_INCLUDEDIR=/usr/local/include \
                -DBOOST_LIBRARYDIR=/usr/local/lib \
                -DBoost_NO_BOOST_CMAKE=ON \
                -DBoost_USE_STATIC_LIBS=ON \
                ../..
          make -j$(sysctl -n hw.ncpu)

      - name: Collect binaries
        run: |
          mkdir -p macos-x64-binaries
          cp build/release/bin/equilibriad macos-x64-binaries/
          cp build/release/bin/equilibria-wallet-rpc macos-x64-binaries/
          cp build/release/bin/equilibria-wallet-cli macos-x64-binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-binaries
          path: macos-x64-binaries/

  build-macos-arm:
    name: Build macOS Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          # Unlink current boost if any, install from source with all components
          brew unlink boost || true
          brew install --build-from-source boost
          brew install openssl@3 libsodium miniupnpc expat protobuf cmake pkgconfig zeromq

      - name: Check Boost installation
        run: |
          echo "=== Boost include ==="
          ls /opt/homebrew/include/boost | head -20
          echo "=== Boost libs ==="
          ls /opt/homebrew/lib/libboost* || echo "No boost libs found"
          echo "=== Brew info ==="
          brew info boost

      - name: Build
        run: |
          mkdir -p build/release
          cd build/release
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_PREFIX_PATH=/opt/homebrew \
                -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
                -DBOOST_ROOT=/opt/homebrew \
                -DBOOST_INCLUDEDIR=/opt/homebrew/include \
                -DBOOST_LIBRARYDIR=/opt/homebrew/lib \
                -DBoost_NO_BOOST_CMAKE=ON \
                -DBoost_USE_STATIC_LIBS=ON \
                ../..
          make -j$(sysctl -n hw.ncpu)

      - name: Collect binaries
        run: |
          mkdir -p macos-arm64-binaries
          cp build/release/bin/equilibriad macos-arm64-binaries/
          cp build/release/bin/equilibria-wallet-rpc macos-arm64-binaries/
          cp build/release/bin/equilibria-wallet-cli macos-arm64-binaries/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binaries
          path: macos-arm64-binaries/
